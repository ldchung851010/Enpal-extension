name: temp setup boundary verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  red-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d0d529ac6e63fef6d597728cc181471e0073dade
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replay new boundary tests on parent
        shell: bash
        run: |
          git diff c38f5846c38a80e6a87ca2f63f6b5aac212ef372 d0d529ac6e63fef6d597728cc181471e0073dade --             tests/integration/setup-flow.test.js             tests/unit/sidepanel-state.test.js             tests/unit/sidepanel-bootstrap.test.js > /tmp/setup-boundary-tests.patch
          git checkout --detach c38f5846c38a80e6a87ca2f63f6b5aac212ef372
          git apply /tmp/setup-boundary-tests.patch
          set +e
          node --test             tests/integration/setup-flow.test.js             tests/unit/sidepanel-state.test.js             tests/unit/sidepanel-bootstrap.test.js             > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo "RED replay unexpectedly passed."
            exit 1
          fi
          echo "RED confirmed: setup/recovery boundary regressions fail on parent."

  green-exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d0d529ac6e63fef6d597728cc181471e0073dade
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact SHA
        run: git rev-parse HEAD
      - name: Focused boundary tests
        run: node --test tests/integration/setup-flow.test.js tests/unit/sidepanel-state.test.js tests/unit/sidepanel-bootstrap.test.js
      - name: Full suite
        run: npm test
      - name: Package exact source
        run: zip -r enpal-d0d529ac6e63fef6d597728cc181471e0073dade.zip . -x ".git/*"
      - uses: actions/upload-artifact@v4
        with:
          name: enpal-d0d529ac6e63fef6d597728cc181471e0073dade
          path: enpal-d0d529ac6e63fef6d597728cc181471e0073dade.zip
          if-no-files-found: error

name: Rebuild Task 1

on:
  push:
    branches:
      - rebuild/v2-multi-workspace
  workflow_dispatch:

jobs:
  task1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Task 1 contract tests
        run: node --test tests/unit/state.test.js tests/unit/config.test.js tests/unit/errors.test.js

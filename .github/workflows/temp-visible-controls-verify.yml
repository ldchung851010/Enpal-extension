name: temp visible learner controls verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  red-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c38f5846c38a80e6a87ca2f63f6b5aac212ef372
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replay new UI regression tests on parent
        shell: bash
        run: |
          git diff 3f43268bac5f1feb02365e46e4d741ca307ceca7 c38f5846c38a80e6a87ca2f63f6b5aac212ef372 -- tests/unit/sidepanel-state.test.js > /tmp/ui-tests.patch
          git checkout --detach 3f43268bac5f1feb02365e46e4d741ca307ceca7
          git apply /tmp/ui-tests.patch
          set +e
          node --test tests/unit/sidepanel-state.test.js > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo "RED replay unexpectedly passed."
            exit 1
          fi
          echo "RED confirmed: visible-controls regression fails on parent."

  green-exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c38f5846c38a80e6a87ca2f63f6b5aac212ef372
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact SHA
        run: git rev-parse HEAD
      - name: Focused UI test
        run: node --test tests/unit/sidepanel-state.test.js
      - name: Full suite
        run: npm test
      - name: Package exact source
        run: zip -r enpal-c38f5846c38a80e6a87ca2f63f6b5aac212ef372.zip . -x ".git/*"
      - uses: actions/upload-artifact@v4
        with:
          name: enpal-c38f5846c38a80e6a87ca2f63f6b5aac212ef372
          path: enpal-c38f5846c38a80e6a87ca2f63f6b5aac212ef372.zip
          if-no-files-found: error

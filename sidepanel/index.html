<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EnPal</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main class="panel" aria-labelledby="app-title">
    <div class="brand">
      <p class="eyebrow">English learning companion</p>
      <h1 id="app-title">EnPal</h1>
    </div>

    <section class="status-card" aria-live="polite">
      <p class="status-label">Status</p>
      <p id="status">Verify setup before starting a lesson.</p>
    </section>

    <div class="actions" aria-label="Lesson actions">
      <button id="setup-action" type="button" hidden>Verify setup</button>
      <button id="confirm-platform-action" type="button" hidden>Confirm Project access verified</button>
      <button id="start-action" type="button" hidden>START</button>
      <button id="pause-action" type="button" hidden>PAUSE</button>
      <button id="end-action" type="button" hidden>END</button>
      <button id="retry-action" type="button" hidden>Retry</button>
    </div>
  </main>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
